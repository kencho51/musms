{% extends "base.html" %}

{% block title %}Register - University Student Management System{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="card" style="width: 100%; max-width: 500px;">
        <div class="card-header">
            <h2 class="card-title text-center">Create Account</h2>
            <p class="card-description text-center">
                Sign up to access the student management system
            </p>
        </div>
        <div class="card-content">
            <form id="registerForm">
                <div class="form-group">
                    <label for="username" class="label">Username</label>
                    <input type="text" id="username" name="username" class="input" required>
                </div>
                
                <div class="form-group">
                    <label for="email" class="label">Email</label>
                    <input type="email" id="email" name="email" class="input" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="label">Password</label>
                    <input type="password" id="password" name="password" class="input" required>
                </div>
                
                <div class="form-group">
                    <label for="role" class="label">Role</label>
                    <select id="role" name="role" class="input">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                
                <button type="submit" class="button button-primary" style="width: 100%;">
                    Create Account
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-sm text-muted-foreground">
                    Already have an account? 
                    <a href="/login" class="text-primary font-semibold">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const formData = new FormData(form);
    const submitButton = form.querySelector('button[type="submit"]');
    
    submitButton.textContent = 'Creating account...';
    submitButton.disabled = true;
    
    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert('Account created successfully');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1000);
        } else {
            showAlert(result.detail || 'Registration failed', 'error');
        }
    } catch (error) {
        showAlert('Network error occurred', 'error');
    } finally {
        submitButton.textContent = 'Create Account';
        submitButton.disabled = false;
    }
});
</script>
{% endblock %}
