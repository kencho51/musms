{% extends "base.html" %}

{% block title %}Login - University Student Management System{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div class="card-header">
            <h2 class="card-title text-center">Sign In</h2>
            <p class="card-description text-center">
                Enter your credentials to access your account
            </p>
        </div>
        <div class="card-content">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="label">Username or Email</label>
                    <input type="text" id="username" name="username" class="input" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="label">Password</label>
                    <input type="password" id="password" name="password" class="input" required>
                </div>
                
                <button type="submit" class="button button-primary" style="width: 100%;">
                    Sign In
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-sm text-muted-foreground">
                    Don't have an account? 
                    <a href="/register" class="text-primary font-semibold">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const formData = new FormData(form);
    const submitButton = form.querySelector('button[type="submit"]');
    
    submitButton.textContent = 'Signing in...';
    submitButton.disabled = true;
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            Auth.setToken(result.access_token);
            Auth.setUserInfo(result.user);
            // Update navigation immediately
            if (typeof updateNavigation === 'function') {
                updateNavigation();
            }
            showAlert('Login successful');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        } else {
            showAlert(result.detail || 'Login failed', 'error');
        }
    } catch (error) {
        showAlert('Network error occurred', 'error');
    } finally {
        submitButton.textContent = 'Sign In';
        submitButton.disabled = false;
    }
});
</script>
{% endblock %}
